services:
  app:
    image: customer-app:1.0
    container_name: customer-app-dev
    restart: unless-stopped
    environment:
      APP_VERSION: "1.0"
      APP_ENVIRONMENT: DEV
      DB_HOST: customer-db-dev
      POSTGRES_DB: customer
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer123
    depends_on:
      db: {condition: service_healthy}
    ports: ["8081:8080"]
    networks: [customer-dev-net]
  db:
    image: postgres:16-alpine
    container_name: customer-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer123
    volumes: [customer-db-dev-data:/var/lib/postgresql/data]
    networks: [customer-dev-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer -d customer"]
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  customer-dev-net: {name: customer-dev-net, driver: bridge}
volumes:
  customer-db-dev-data: {name: customer-db-dev-data}
